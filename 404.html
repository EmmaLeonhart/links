<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="description" content="That page wandered off. Find your way back to Emma Leonhart's links.">
  <title>404 — Not Found · Emma Leonhart</title>

  <!-- Canonical identity: set theme before first paint (dark default). See /_identity/. -->
  <script>(function(){try{var t=localStorage.getItem('theme');if(t!=='light'&&t!=='dark')t='dark';document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- The ONE shared identity: palette, buttons, toggle, type. Served from this repo's root. -->
  <link rel="stylesheet" href="/identity.css">

  <style>
    /* Palette, buttons, toggle, type and primitives all come from
       /identity.css — the single source of truth. */

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 24px 120px;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: 'cv11', 'ss01', 'ss03';
      letter-spacing: -0.005em;
    }

    .grain {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.020) 1px, transparent 0);
      background-size: 32px 32px;
      mask-image: linear-gradient(to bottom, black 0%, black 70%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, black 0%, black 70%, transparent 100%);
    }

    .container { max-width: 540px; width: 100%; position: relative; z-index: 2; text-align: center; }

    .code {
      font-family: var(--mono); font-weight: 500;
      font-size: 0.68rem; letter-spacing: 1.8px; text-transform: uppercase;
      color: var(--text-faint); margin-bottom: 22px;
      display: inline-flex; align-items: center; gap: 12px;
    }
    .code::before, .code::after {
      content: ''; width: 28px; height: 1px;
      background: var(--border-strong); opacity: 0.7;
    }

    h1 {
      font-family: var(--serif); font-style: italic;
      font-size: clamp(4rem, 18vw, 7rem); font-weight: 400;
      color: var(--text-strong); line-height: 0.95;
      margin-bottom: 14px; letter-spacing: -1px;
    }

    .lead {
      font-family: var(--serif); font-style: italic;
      font-size: 1.45rem; color: var(--text-strong);
      margin-bottom: 10px;
    }
    .tagline {
      font-size: 1rem; color: var(--text-mute); line-height: 1.5;
      margin-bottom: 40px;
    }

    .actions {
      display: flex; flex-wrap: wrap; gap: 12px;
      justify-content: center; align-items: center;
    }

    .footer {
      margin-top: 56px; color: var(--text-faint); font-family: var(--mono);
      font-size: 0.7rem; letter-spacing: 1px;
    }

    @media (max-width: 480px) {
      body { padding: 64px 18px 96px; }
      .lead { font-size: 1.25rem; }
      .actions .btn { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .aurora::before, .aurora::after { animation: none !important; }
    }
  </style>
</head>
<body>

    <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.75,4.09L15.22,6.03L16.13,9.09L13.5,7.28L10.87,9.09L11.78,6.03L9.25,4.09L12.44,4L13.5,1L14.56,4L17.75,4.09M21.25,11L19.61,12.25L20.2,14.23L18.5,13.06L16.8,14.23L17.39,12.25L15.75,11L17.81,10.95L18.5,9L19.19,10.95L21.25,11M18.97,15.95C19.8,15.87 20.69,17.05 20.16,17.8C19.84,18.25 19.5,18.67 19.08,19.07C15.17,23 8.84,23 4.94,19.07C1.03,15.17 1.03,8.83 4.94,4.93C5.34,4.53 5.76,4.17 6.21,3.85C6.96,3.32 8.14,4.21 8.06,5.04C7.79,7.9 8.75,10.87 10.95,13.06C13.14,15.26 16.1,16.22 18.97,15.95M17.33,17.97C14.5,17.81 11.7,16.64 9.53,14.5C7.36,12.31 6.2,9.5 6.04,6.68C3.23,9.82 3.34,14.4 6.35,17.41C9.37,20.43 14,20.54 17.33,17.97Z"></path></svg>
  </button>

  <div class="aurora" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <main class="container">
    <p class="code">Error 404</p>
    <h1>404</h1>
    <p class="lead">This link wandered off.</p>
    <p class="tagline">The page you're after doesn't exist — or it moved. Head back to the links hub, or jump straight to the main site.</p>

    <div class="actions">
      <a class="btn btn-primary" href="/">Back to Links</a>
      <a class="btn btn-secondary" href="https://emmaleonhart.com/">Main Site</a>
      <a class="btn btn-secondary" href="https://github.com/emmaleonhart">GitHub</a>
    </div>

    <footer class="footer">
      links.emmaleonhart.com
    </footer>
  </main>

  <script>(function(){var b=document.getElementById('theme-toggle');if(!b)return;b.addEventListener('click',function(){var c=document.documentElement.getAttribute('data-theme')==='light'?'light':'dark';var n=c==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('theme',n);}catch(e){}});})();</script>
</body>
</html>
